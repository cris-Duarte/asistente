name: Automated Backup

on:
  schedule:
    # Daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup-database:
    name: Backup Database to R2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pg_dump
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Create backup
        run: |
          DATE=$(date +%Y-%m-%d_%H-%M-%S)
          BACKUP_FILE="backup_${DATE}.sql"
          pg_dump "${{ secrets.DATABASE_URL }}" > "$BACKUP_FILE"
          gzip "$BACKUP_FILE"
          echo "BACKUP_FILE=${BACKUP_FILE}.gz" >> $GITHUB_ENV

      - name: Upload to R2
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SOURCE_DIR: .

      - name: Cleanup old backups (keep last 30 days)
        run: |
          # This would need a more sophisticated cleanup script
          # For now, we rely on R2 lifecycle policies
          echo "Backup completed. Configure R2 lifecycle policy to delete backups older than 30 days."

  backup-electric-data:
    name: Backup ElectricSQL Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl/actions/setup-flyctl@master

      - name: Create ElectricSQL data backup
        run: |
          # SSH into Fly.io machine and backup /data directory
          fly ssh console -C "tar -czf /tmp/electric-backup.tar.gz -C /data ." -a productivity-electric
          fly sftp get /tmp/electric-backup.tar.gz ./electric-backup.tar.gz -a productivity-electric

      - name: Upload to R2
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          SOURCE_DIR: .