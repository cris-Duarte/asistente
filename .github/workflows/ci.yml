name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: productivity
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d productivity"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate an empty database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/productivity?sslmode=disable
        run: pnpm --filter @productivity-assistant/db-schema db:migrate

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [quality, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          APP_DOMAIN=example.com POSTGRES_PASSWORD=test-password REDIS_PASSWORD=test-password ELECTRIC_SECRET=test-secret docker compose -f compose.prod.yaml config --quiet
      - name: Build and start from empty volumes
        run: docker compose -p productivity-ci up --build --wait
      - name: Check public services
        run: |
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8787/health
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:5173
      - name: Owner authentication E2E
        run: |
          SETUP_URL="$(docker compose -p productivity-ci exec -T -e OWNER_EMAIL=owner@example.test -e OWNER_NAME=Owner api pnpm --filter @productivity-assistant/api owner:init | tail -n 1 | tr -d '\r')"
          E2E_BASE_URL=http://localhost:5173 E2E_SETUP_URL="$SETUP_URL" pnpm test:e2e
      - name: Verify backup and restore
        run: |
          BACKUP_DIR=/tmp/productivity-backups COMPOSE_PROJECT_NAME=productivity-ci sh infra/scripts/backup.sh > /tmp/backup-path
          COMPOSE_PROJECT_NAME=productivity-ci sh infra/scripts/restore.sh "$(cat /tmp/backup-path)"
      - name: Logs after failure
        if: failure()
        run: docker compose -p productivity-ci logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -p productivity-ci down -v

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        display: [st7121, st7123]
    steps:
      - uses: actions/checkout@v4
      - name: Build native tests and firmware
        env:
          DISPLAY_VARIANT: ${{ matrix.display }}
        run: docker compose --profile firmware run --rm --build firmware
      - uses: actions/upload-artifact@v4
        with:
          name: tab5-${{ matrix.display }}
          path: apps/firmware/artifacts/${{ matrix.display }}/
          if-no-files-found: error
