name = "productivity-api"
main = "src/index.ts"
compatibility_date = "2024-09-19"
compatibility_flags = ["nodejs_compat"]

[vars]
DATABASE_URL = "postgresql://postgres:postgres@127.0.0.1:5432/productivity?sslmode=disable"
DATABASE_URL_UNPOOLED = "postgresql://postgres:postgres@127.0.0.1:5432/productivity?sslmode=disable"
JWT_SECRET = "dev-jwt-secret-at-least-32-characters-long"
ELECTRIC_URL = "http://localhost:3000"
ELECTRIC_SECRET = "dev-secret"

[env]
# Production environment
[env.production]
vars = { ENVIRONMENT = "production" }

# Preview environment
[env.preview]
vars = { ENVIRONMENT = "preview" }

# Durable Objects
[[durable_objects.bindings]]
name = "WEBSOCKET_SERVER"
class_name = "WebSocketServer"

# Durable Object exports (required for Wrangler 4.x)
[exports.WebSocketServer]
type = "durable-object"
storage = "sqlite"

# KV for session storage (optional)
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "your-kv-namespace-id"

# R2 for backups
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "productivity-backups"

# Hyperdrive for Neon connection (recommended for production)
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "your-hyperdrive-id"

# D1 for local development (optional)
# [[d1_databases]]
# binding = "DB"
# database_name = "productivity-local"
# database_id = "your-d1-id"